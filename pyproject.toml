[project]
name = "stt"
version = "0.1.0"
description = "English Qwen3 speech-to-text CLI for Apple Silicon"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-qwen3-asr==0.3.5",
    "huggingface-hub>=0.20,<2",
]

[project.scripts]
stt = "stt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
